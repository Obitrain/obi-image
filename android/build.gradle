buildscript {
  ext.ReactNativeImage = [
    kotlinVersion: "2.2.0",
    minSdkVersion: 24,
    compileSdkVersion: 37,
    ndkVersion: "27.1.12297006"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNativeImage[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply from: '../nitrogen/generated/android/obitrain_reactnativeimage+autolinking.gradle'

apply plugin: "com.facebook.react"

react {
  // Only our own JS: hoisted example deps (e.g. FastImage's *NativeComponent spec) must not be codegen'd into this lib.
  jsRootDir = file("../src")
}

android {
  namespace "com.margelo.nitro.obitrain.reactnativeimage"

  compileSdkVersion getExtOrDefault("compileSdkVersion")
  // Must match the app's NDK: libc++_shared.so is packaged from react-android/fbjni (NDK 27); a newer NDK here
  // emits libc++ symbols (e.g. __cxa_init_primary_exception) that library lacks → dlopen fails in release.
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())

        buildTypes {
          debug {
            cppFlags "-O1 -g"
          }
          release {
            cppFlags "-O2"
          }
        }
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources {
      excludes += [
        "META-INF",
        "META-INF/**"
      ]
    }

    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libfolly_json.so",
        "**/libfolly_runtime.so",
        "**/libglog.so",
        "**/libhermes.so",
        "**/libhermes-executor-debug.so",
        "**/libhermes_executor.so",
        "**/libreactnative.so",
        "**/libreactnativejni.so",
        "**/libturbomodulejsijni.so",
        "**/libreact_nativemodule_core.so",
        "**/libjscexecutor.so"
      ]
    }
  }

  buildFeatures {
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

def coilVersion = "3.4.0" // newest Coil built with Kotlin <= 2.3 (readable by the app's Kotlin 2.2)

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "io.coil-kt.coil3:coil-core:$coilVersion"
  implementation "io.coil-kt.coil3:coil-network-okhttp:$coilVersion"
  implementation "io.coil-kt.coil3:coil-gif:$coilVersion"
}

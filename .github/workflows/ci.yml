name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generated Nitro code must be committed and current
        run: yarn nitrogen && git diff --exit-code -- nitrogen src/generated

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck


  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  expo-checks:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Check Expo dependencies
        working-directory: example
        run: npx --yes expo-doctor@1.20.4 --verbose
        env:
          # patch drift is handled by Renovate after minimumReleaseAge
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: 1

      - name: Export native bundles
        run: yarn example export

      - name: Test config plugins
        run: yarn example test:plugins

  build-android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android project
        run: yarn example prebuild --clean --no-install --platform android

      - name: Build Android example
        run: yarn example build:android

  build-ios:
    runs-on: macos-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26'

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build iOS example
        run: yarn example build:ios


  e2e-ios:
    runs-on: macos-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26'

      - name: Install applesimutils
        run: brew tap wix/brew && brew trust --tap wix/brew && brew install applesimutils

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build Detox framework cache
        working-directory: example
        run: npx detox build-framework-cache

      - name: Build iOS release for Detox
        run: yarn example e2e:build:ios

      - name: Run Detox
        run: yarn example e2e:ios --headless --cleanup --record-logs failing --take-screenshots failing --artifacts-location artifacts

      - name: Upload Detox artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detox-ios
          path: example/artifacts

  e2e-android:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      DETOX_ANDROID_ARCH: x86_64
      DETOX_ADB_NAME: emulator-5554
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Install JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '17'

      - name: Generate Android project
        run: yarn example prebuild --clean --no-install --platform android

      - name: Build Android release and test APKs for Detox
        run: yarn example e2e:build:android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Detox on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: yarn example detox test -c android.att.release --headless --cleanup --record-logs failing --take-screenshots failing --artifacts-location artifacts

      - name: Upload Detox artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detox-android
          path: example/artifacts

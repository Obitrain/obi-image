# iOS Detox runs only on release/<version> PRs, PRs labelled `e2e`, or by hand: too slow and flaky for every PR.
name: e2e-ios
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.pull_request.head.ref, 'release/') ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    env:
      CI: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build local library
        run: yarn prepare

      - name: Use Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26'

      - name: Install applesimutils
        run: brew tap wix/brew && brew trust --tap wix/brew && brew install applesimutils

      - name: Generate iOS project
        run: yarn example prebuild --clean --no-install --platform ios

      - name: Install CocoaPods dependencies
        working-directory: example/ios
        run: pod install

      - name: Build Detox framework cache
        working-directory: example
        run: npx detox build-framework-cache

      - name: Build iOS release for Detox
        run: yarn example e2e:build:ios

      - name: Run Detox
        run: yarn example e2e:ios --headless --cleanup --retries 1 --record-logs failing --take-screenshots failing --artifacts-location artifacts

      - name: Upload Detox artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detox-ios
          path: example/artifacts

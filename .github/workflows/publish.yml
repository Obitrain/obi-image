# Publishes a release when a v* tag is pushed: checks, GitHub release with the tarball, npm publish via
# trusted publishing (OIDC — no NPM_TOKEN; the trusted publisher on npmjs.com must point at this file).
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create
  id-token: write # npm OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: yarn install --immutable

      - name: Version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG"; exit 1; }

      - name: Generated Nitro code must be committed and current
        run: yarn nitrogen && git diff --exit-code -- nitrogen src/generated

      - run: yarn typecheck
      - run: yarn lint

      - name: Pack (runs prepack → bob build)
        run: yarn pack --out "/tmp/obitrain-react-native-image-${GITHUB_REF_NAME#v}.tgz"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" /tmp/obitrain-react-native-image-*.tgz --title "$GITHUB_REF_NAME" --generate-notes

      - name: npm publish (trusted publishing, provenance)
        run: |
          npm install -g npm@latest # OIDC trusted publishing needs npm >= 11.5
          npm publish --provenance --access public
